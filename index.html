<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:#fff;
  color:#111;
  min-height:100vh;
  display:flex;
  flex-direction:column;
}
.main{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:50px 6% 30px;
  gap:70px;
  max-width:1400px;
  margin:0 auto;
  width:100%;
}
.left{
  flex:1;
  max-width:480px;
}
.badge{
  display:inline-flex;
  align-items:center;
  gap:8px;
  font-size:11px;
  font-weight:600;
  color:#e11d48;
  letter-spacing:.6px;
  text-transform:uppercase;
  margin-bottom:22px;
}
.badge::before{
  content:"";
  width:7px;
  height:7px;
  background:#e11d48;
  border-radius:50%;
}
h1{
  font-size:clamp(2.6rem,5.2vw,4rem);
  font-weight:800;
  line-height:1.02;
  letter-spacing:-1.8px;
  margin-bottom:14px;
}
h1 .blk{color:#111}
h1 .red{color:#e11d48}
.sub{
  font-size:1rem;
  color:#444;
  line-height:1.5;
  margin-bottom:28px;
  max-width:400px;
}
.sub strong{color:#111;font-weight:600}
.btn{
  display:inline-flex;
  align-items:center;
  gap:10px;
  background:#e11d48;
  color:#fff;
  font-size:1.05rem;
  font-weight:700;
  padding:15px 30px;
  border-radius:11px;
  text-decoration:none;
  box-shadow:0 8px 22px rgba(225,29,72,.32);
  transition:all .2s;
  cursor:pointer;
}
.btn:hover{
  background:#be123c;
  transform:translateY(-2px);
  box-shadow:0 12px 26px rgba(225,29,72,.42);
}
.btn svg{width:20px;height:20px}
.comp{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:26px;
  font-size:.88rem;
  color:#555;
}
.comp svg{width:20px;height:20px;fill:#16a34a}
.comp span{font-size:.78rem;color:#888;display:block}
.right{
  flex:1.15;
  display:flex;
  justify-content:center;
}
.card{
  width:100%;
  max-width:560px;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 22px 45px -10px rgba(0,0,0,.22),0 0 0 1px rgba(225,29,72,.08);
}
.card img{
  width:100%;
  height:auto;
  display:block;
}
.footer{
  border-top:1px solid #e8e8e8;
  padding:16px 6%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  max-width:1400px;
  margin:0 auto;
  width:100%;
}
.ft-left{
  font-size:.7rem;
  font-weight:700;
  color:#e11d48;
  letter-spacing:1.1px;
  text-transform:uppercase;
}
.ft-right{
  display:flex;
  align-items:center;
  gap:26px;
}
.ft-item{
  font-size:.88rem;
  font-weight:500;
  color:#333;
  display:flex;
  align-items:center;
  gap:7px;
}
.ft-item i{
  width:5px;
  height:5px;
  background:#e11d48;
  border-radius:50%;
  display:inline-block;
}
@media(max-width:920px){
  .main{flex-direction:column;text-align:center;padding:40px 5% 25px;gap:36px}
  .left{max-width:100%}
  .sub{margin:0 auto 28px}
  .comp{justify-content:center}
  .card{max-width:100%}
  .footer{flex-direction:column;gap:12px;text-align:center}
  .ft-right{justify-content:center;gap:18px;flex-wrap:wrap}
}
@media(max-width:480px){
  h1{font-size:2.3rem}
  .btn{width:100%;justify-content:center}
  .ft-item{font-size:.8rem}
}
</style>
